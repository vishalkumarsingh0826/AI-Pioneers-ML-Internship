
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake News Detection</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        .container {
            max-width: 750px;
            margin: 70px auto;
            padding: 35px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #1d4ed8;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        textarea {
            width: 100%;
            height: 220px;
            padding: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 18px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 25px;
            padding: 18px;
            border-radius: 8px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .fake {
            background: #fee2e2;
            color: #b91c1c;
        }

        .real {
            background: #dcfce7;
            color: #15803d;
        }

        .note {
            margin-top: 25px;
            color: #64748b;
            font-size: 13px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .container {
                margin: 20px;
                padding: 22px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>Fake News Detection</h1>

        <p class="subtitle">
            AI-powered news classification using Natural Language Processing
        </p>

        <form method="POST">
            <textarea
                name="news"
                placeholder="Paste your news article here..."
                required>{{ news_text }}</textarea>

            <button type="submit">Analyze News</button>
        </form>

        {% if prediction %}
            <div class="result {{ 'fake' if prediction == 'Fake News' else 'real' }}">
                Prediction: {{ prediction }}
            </div>
        {% endif %}

        <p class="note">
            Note: Predictions are estimates based on the training dataset.
            Always verify news using reliable sources.
        </p>

    </div>
</body>
</html>
